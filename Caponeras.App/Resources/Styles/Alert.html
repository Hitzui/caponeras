<div class="container">
    <div class="popup">
        <div class="stripe"></div>
        <div class="content">
            <div class="icon-container">
                <img src="${Image}" class="icon" alt="" />
            </div>
            <div class="message">
                <div class="caption">${Caption}</div>
                <div class="text">${Text}</div>
            </div>
            <div id="closeButton" class="close-button">
                <img src="message_close" class="close-icon" alt="" />
            </div>
        </div>
    </div>
</div>
